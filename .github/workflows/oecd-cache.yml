name: OECD cache refresh
# Weekly pull of OECD MSTI (R&D % GDP, researchers) into data/oecd-cache.json, the dated
# fallback served when the live OECD gateway rate-limits. Commits only on a successful pull.
on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull OECD MSTI into the cache
        run: node --experimental-strip-types scripts/build-oecd-cache.mjs
      - name: Commit the refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oecd-cache.json
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -m "chore: refresh OECD cache [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i*10)); done; exit 1
