name: Live source contract
# Weekly check that the public APIs behind the index still answer the way the scorer expects
# (pagination, current WGI codes, 200-with-error detection). Opens an issue if it breaks.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run live contract tests
        run: LIVE_CONTRACT=1 npx vitest run lib/__tests__/contract.live.test.ts
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Live source contract failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The weekly World Bank contract tests failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
