name: Nightly scores
# Recomputes the index from the live sources every night and commits:
#   data/scores-live.json   latest /api/scores payload (served while < 36h old)
#   data/history/DATE.json  dated snapshot (immutable; citable permalink)
#   data/history/series.json aligned history for charts and movers
# The commit triggers a Vercel deploy so the site serves the new snapshot. Source failures are
# recorded in the dated snapshot; scores-live.json is only replaced when live World Bank data arrived.
on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Score every economy from live sources
        run: npx tsx scripts/build-scores.ts
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores-live.json data/history
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -m "chore: nightly scores snapshot $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i*15)); done
          exit 1
      - name: Open an issue if the nightly run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly scores run failed";
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "nightly-scores" });
            if (open.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ["nightly-scores"],
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
